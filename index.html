:root {
  --bg: #FFFCF8;
  --card: #FFFFFF;
  --card-2: #FFF7ED;
  --ink: #1A1816;
  --muted: #9A9590;
  --muted-2: #C4BFB9;
  --line: #F2EDE7;
  --accent: #111111;
  --accent-2: #FF6B3D;
  --red: #FF3B30;
  --shadow: 0 12px 40px rgba(26,24,22,0.06), 0 2px 12px rgba(26,24,22,0.04);
  --shadow-sm: 0 4px 20px rgba(26,24,22,0.05);
  --radius: 20px;
  --radius-sm: 14px;
  --radius-full: 999px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141210;
    --card: #1E1C1A;
    --card-2: #262320;
    --ink: #F5F1EB;
    --muted: #9A9590;
    --muted-2: #5A5652;
    --line: #2A2724;
    --accent: #F5F1EB;
    --accent-2: #FF7A50;
    --shadow: 0 12px 40px rgba(0,0,0,0.3);
    --shadow-sm: 0 4px 20px rgba(0,0,0,0.2);
  }
}

* {
  font-family: "Noto Sans HK", -apple-system, BlinkMacSystemFont, "SF Pro", "PingFang HK", sans-serif;
}

.serif {
  font-family: "Instrument Serif", Georgia, serif;
}

body {
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  margin:0;
}

::-webkit-scrollbar {
  display: none;
}

button {
  -webkit-tap-highlight-color: transparent;
}

/* number pad active */

.numpad-btn:active {
  transform: scale(0.96);
  background: var(--line);
}

/* iPhone Widget Ready - standalone mode: 要夠大,唔要有邊 */

@media (display-mode: standalone) {
  body {
    margin: 0 !important;
    padding: 0 !important;
    background: #FFFCF8 !important;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
  }

  /* remove outer borders, larger padding, hide browser UI hints */

  .standalone-card {
    border: 0 !important;
    box-shadow: 0 8px 32px rgba(26,24,22,0.06) !important;
    border-radius: 28px !important;
  }

  .hide-in-standalone {
    display: none !important;
  }

  .standalone-pad {
    padding: 20px !important;
  }
}

/* Global no-border soft look: 唔要有邊 */

.no-border-card {
  border: 0 !important;
  box-shadow: 0 10px 36px rgba(26,24,22,0.07), 0 2px 10px rgba(26,24,22,0.04) !important;
}

/* widget minimal typography */

.widget-huge {
  font-size: 80px;
  line-height: 0.85;
  letter-spacing: -0.06em;
  font-weight: 800;
}

@media (max-width: 390px) {
  .widget-huge {
    font-size: 64px;
  }
}

/* larger touch targets */

.touch-48 {
  min-height: 48px;
}

.touch-52 {
  min-height: 52px;
}
